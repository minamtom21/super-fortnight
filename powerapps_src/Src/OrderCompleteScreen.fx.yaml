OrderCompleteScreen As screen.screen:
    Fill: =RGBA(245, 247, 250, 1)
    OnVisible: |-
        =Clear(colCart);
        Set(gblTotalAmount, 0)

    lblSuccessIcon As label:
        Text: ="✅"
        Size: =72
        Align: =Align.Center
        X: =0
        Y: =80
        Width: =Parent.Width
        Height: =90

    lblCompleteTitle As label:
        Text: ="ご注文ありがとうございます！"
        Size: =20
        FontWeight: =FontWeight.Bold
        Color: =RGBA(46, 204, 113, 1)
        Align: =Align.Center
        X: =0
        Y: =180
        Width: =Parent.Width
        Height: =36

    lblOrderIDLabel As label:
        Text: ="注文番号"
        Size: =14
        Color: =RGBA(100, 100, 100, 1)
        Align: =Align.Center
        X: =0
        Y: =230
        Width: =Parent.Width
        Height: =24

    lblOrderID As label:
        Text: =gblOrderID
        Size: =18
        FontWeight: =FontWeight.Bold
        Color: =RGBA(41, 128, 185, 1)
        Align: =Align.Center
        X: =0
        Y: =258
        Width: =Parent.Width
        Height: =32

    lblOrderedStore As label:
        Text: =gblCurrentStore.StoreName
        Size: =16
        FontWeight: =FontWeight.Bold
        Color: =RGBA(30, 30, 30, 1)
        X: =30
        Y: =310
        Width: =Parent.Width - 60
        Height: =28

    lblEstimatedTime As label:
        Text: ="配達予定時間: 約 " & gblCurrentStore.DeliveryTimeMax & " 分"
        Size: =15
        Color: =RGBA(80, 80, 80, 1)
        X: =30
        Y: =346
        Width: =Parent.Width - 60
        Height: =28

    lblOrderAmount As label:
        Text: |-
            ="お支払い合計: " & Char(165) & Text(gblTotalAmount + gblCurrentStore.DeliveryFee, "#,##0")
        Size: =15
        Color: =RGBA(80, 80, 80, 1)
        X: =30
        Y: =382
        Width: =Parent.Width - 60
        Height: =28

    btnViewHistory As button:
        Text: ="注文履歴を確認する"
        Fill: =RGBA(255, 255, 255, 1)
        Color: =RGBA(41, 128, 185, 1)
        BorderColor: =RGBA(41, 128, 185, 1)
        BorderThickness: =2
        BorderRadius: =10
        Size: =15
        X: =20
        Y: =450
        Width: =Parent.Width - 40
        Height: =50
        OnSelect: =Navigate(OrderHistoryScreen, ScreenTransition.Fade)

    btnBackToHome As button:
        Text: ="ホームに戻る"
        Fill: =RGBA(41, 128, 185, 1)
        Color: =RGBA(255, 255, 255, 1)
        BorderThickness: =0
        BorderRadius: =10
        Size: =16
        FontWeight: =FontWeight.Bold
        X: =20
        Y: =512
        Width: =Parent.Width - 40
        Height: =50
        OnSelect: |-
            =Set(gblCurrentStore, Blank());
            Navigate(HomeScreen, ScreenTransition.Fade)
