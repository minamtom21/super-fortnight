HomeScreen As screen.screen:
    Fill: =RGBA(245, 247, 250, 1)

    rectHeaderHome As rectangle:
        Fill: =RGBA(41, 128, 185, 1)
        X: =0
        Y: =0
        Width: =Parent.Width
        Height: =100

    lblAppTitle As label:
        Text: ="南部市場 出前"
        Size: =22
        FontWeight: =FontWeight.Bold
        Color: =RGBA(255, 255, 255, 1)
        X: =20
        Y: =25
        Width: =Parent.Width - 100
        Height: =50

    lblSubtitle As label:
        Text: ="横浜市金沢区 南部市場周辺"
        Size: =12
        Color: =RGBA(200, 230, 255, 1)
        X: =20
        Y: =68
        Width: =300
        Height: =25

    rectSearchBg As rectangle:
        Fill: =RGBA(255, 255, 255, 1)
        BorderColor: =RGBA(200, 200, 200, 1)
        BorderThickness: =1
        BorderRadius: =20
        X: =15
        Y: =110
        Width: =Parent.Width - 30
        Height: =45

    txtSearch As textInput:
        Default: =""
        HintText: ="お店・料理名で検索"
        Size: =14
        BorderThickness: =0
        X: =50
        Y: =112
        Width: =Parent.Width - 80
        Height: =40

    lblCategoryTitle As label:
        Text: ="カテゴリから選ぶ"
        Size: =16
        FontWeight: =FontWeight.Bold
        Color: =RGBA(50, 50, 50, 1)
        X: =15
        Y: =165
        Width: =250
        Height: =30

    galCategories As gallery.BrowseLayout:
        Items: =colCategories
        TemplateSize: =90
        WrapCount: =4
        X: =15
        Y: =200
        Width: =Parent.Width - 30
        Height: =200
        ShowScrollbar: =false

        rectCatCard As rectangle:
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(220, 220, 220, 1)
            BorderThickness: =1
            BorderRadius: =12
            Width: =Parent.TemplateWidth - 8
            Height: =80
            X: =4
            Y: =5

        lblCatIcon As label:
            Text: =ThisItem.Icon
            Size: =28
            Align: =Align.Center
            X: =4
            Y: =8
            Width: =Parent.TemplateWidth - 8
            Height: =38

        lblCatName As label:
            Text: =ThisItem.CategoryName
            Size: =10
            Align: =Align.Center
            Color: =RGBA(60, 60, 60, 1)
            X: =4
            Y: =48
            Width: =Parent.TemplateWidth - 8
            Height: =28

        btnCatSelect As button:
            Text: =""
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            Width: =Parent.TemplateWidth - 8
            Height: =80
            X: =4
            Y: =5
            OnSelect: |-
                =Set(gblSelectedCategory, ThisItem);
                Navigate(StoreListScreen, ScreenTransition.Fade)

    lblPopularTitle As label:
        Text: ="近くの人気店"
        Size: =16
        FontWeight: =FontWeight.Bold
        Color: =RGBA(50, 50, 50, 1)
        X: =15
        Y: =412
        Width: =200
        Height: =30

    galPopularStores As gallery.BrowseLayout:
        Items: =Sort(Filter(colStores, IsOpen = true), Rating, SortOrder.Descending)
        TemplateSize: =220
        X: =0
        Y: =448
        Width: =Parent.Width
        Height: =220
        ShowScrollbar: =false

        rectStoreCard As rectangle:
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(230, 230, 230, 1)
            BorderThickness: =1
            BorderRadius: =12
            Width: =210
            Height: =200
            X: =5
            Y: =5

        lblSName As label:
            Text: =ThisItem.StoreName
            Size: =13
            FontWeight: =FontWeight.Bold
            Color: =RGBA(40, 40, 40, 1)
            X: =12
            Y: =128
            Width: =190
            Height: =24

        lblSDelivery As label:
            Text: ="配達 " & ThisItem.DeliveryTimeMin & "〜" & ThisItem.DeliveryTimeMax & "分"
            Size: =11
            Color: =RGBA(120, 120, 120, 1)
            X: =12
            Y: =154
            Width: =190
            Height: =20

        lblSRating As label:
            Text: |-
                ="★ " & Text(ThisItem.Rating, "0.0") & "  最低" & Text(ThisItem.MinimumOrder, "#,##0") & "円"
            Size: =11
            Color: =RGBA(230, 126, 34, 1)
            X: =12
            Y: =174
            Width: =190
            Height: =20

        btnStoreSelect As button:
            Text: =""
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            Width: =210
            Height: =200
            X: =5
            Y: =5
            OnSelect: |-
                =Set(gblCurrentStore, ThisItem);
                Navigate(MenuScreen, ScreenTransition.Fade)

    btnOrderHistory As button:
        Text: ="注文履歴を見る"
        Fill: =RGBA(255, 255, 255, 1)
        BorderColor: =RGBA(41, 128, 185, 1)
        BorderThickness: =2
        Color: =RGBA(41, 128, 185, 1)
        Size: =14
        BorderRadius: =8
        X: =15
        Y: =685
        Width: =Parent.Width - 30
        Height: =48
        OnSelect: =Navigate(OrderHistoryScreen, ScreenTransition.Fade)
