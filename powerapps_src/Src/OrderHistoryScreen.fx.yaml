OrderHistoryScreen As screen.screen:
    Fill: =RGBA(245, 247, 250, 1)

    rectHeaderHist As rectangle:
        Fill: =RGBA(41, 128, 185, 1)
        X: =0
        Y: =0
        Width: =Parent.Width
        Height: =80

    btnBackHistory As button:
        Text: ="← ホーム"
        Fill: =RGBA(0, 0, 0, 0)
        Color: =RGBA(255, 255, 255, 1)
        BorderThickness: =0
        Size: =14
        X: =5
        Y: =22
        Width: =90
        Height: =36
        OnSelect: =Navigate(HomeScreen, ScreenTransition.Fade)

    lblHistoryTitle As label:
        Text: ="注文履歴"
        Size: =20
        FontWeight: =FontWeight.Bold
        Color: =RGBA(255, 255, 255, 1)
        X: =100
        Y: =22
        Width: =200
        Height: =36

    galOrders As gallery.BrowseLayout:
        Items: =Sort(colOrders, OrderDate, SortOrder.Descending)
        TemplateSize: =130
        X: =0
        Y: =88
        Width: =Parent.Width
        Height: =Parent.Height - 88

        rectOrderCard As rectangle:
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(230, 230, 230, 1)
            BorderThickness: =1
            BorderRadius: =10
            X: =10
            Y: =5
            Width: =Parent.Width - 20
            Height: =118

        lblOrderStatus As label:
            Text: =Switch(ThisItem.Status, "注文受付", "受付中", "準備中", "準備中", "配達中", "配達中", "配達完了", "完了", ThisItem.Status)
            Size: =11
            FontWeight: =FontWeight.Bold
            Color: =Switch(ThisItem.Status, "注文受付", RGBA(41,128,185,1), "準備中", RGBA(230,126,34,1), "配達中", RGBA(46,204,113,1), RGBA(80,80,80,1))
            Align: =Align.Center
            X: =Parent.Width - 100
            Y: =14
            Width: =80
            Height: =22

        lblOrderStoreName As label:
            Text: =ThisItem.StoreName
            Size: =15
            FontWeight: =FontWeight.Bold
            Color: =RGBA(30, 30, 30, 1)
            X: =20
            Y: =12
            Width: =Parent.Width - 130
            Height: =26

        lblHistOrderID As label:
            Text: ="注文No. " & ThisItem.OrderID
            Size: =11
            Color: =RGBA(130, 130, 130, 1)
            X: =20
            Y: =40
            Width: =Parent.Width - 40
            Height: =20

        lblOrderDate As label:
            Text: =ThisItem.OrderDate
            Size: =12
            Color: =RGBA(100, 100, 100, 1)
            X: =20
            Y: =62
            Width: =Parent.Width - 40
            Height: =20

        lblHistOrderAmount As label:
            Text: |-
                =Char(165) & Text(ThisItem.TotalAmount, "#,##0") & "  " & ThisItem.PaymentMethod
            Size: =13
            FontWeight: =FontWeight.Bold
            Color: =RGBA(41, 128, 185, 1)
            X: =20
            Y: =84
            Width: =Parent.Width - 40
            Height: =24

        lblOrderAddress As label:
            Text: =ThisItem.DeliveryAddress
            Size: =11
            Color: =RGBA(120, 120, 120, 1)
            X: =20
            Y: =106
            Width: =Parent.Width - 40
            Height: =16
            Overflow: =Overflow.Hidden
