CartScreen As screen.screen:
    Fill: =RGBA(245, 247, 250, 1)

    rectHeaderCart As rectangle:
        Fill: =RGBA(41, 128, 185, 1)
        X: =0
        Y: =0
        Width: =Parent.Width
        Height: =80

    btnBackCart As button:
        Text: ="← メニュー"
        Fill: =RGBA(0, 0, 0, 0)
        Color: =RGBA(255, 255, 255, 1)
        BorderThickness: =0
        Size: =14
        X: =5
        Y: =22
        Width: =100
        Height: =36
        OnSelect: =Navigate(MenuScreen, ScreenTransition.Fade)

    lblCartTitle As label:
        Text: ="カート"
        Size: =20
        FontWeight: =FontWeight.Bold
        Color: =RGBA(255, 255, 255, 1)
        X: =110
        Y: =22
        Width: =200
        Height: =36

    btnClearCart As button:
        Text: ="クリア"
        Fill: =RGBA(231, 76, 60, 0.8)
        Color: =RGBA(255, 255, 255, 1)
        BorderThickness: =0
        BorderRadius: =6
        Size: =12
        X: =Parent.Width - 75
        Y: =27
        Width: =65
        Height: =28
        OnSelect: |-
            =Clear(colCart);
            Set(gblTotalAmount, 0)

    lblCartStoreName As label:
        Text: =gblCurrentStore.StoreName & " からの注文"
        Size: =14
        Color: =RGBA(80, 80, 80, 1)
        X: =15
        Y: =88
        Width: =Parent.Width - 30
        Height: =28

    galCartItems As gallery.BrowseLayout:
        Items: =colCart
        TemplateSize: =78
        X: =0
        Y: =118
        Width: =Parent.Width
        Height: =Parent.Height - 310

        rectCartItemCard As rectangle:
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(235, 235, 235, 1)
            BorderThickness: =1
            BorderRadius: =8
            X: =10
            Y: =4
            Width: =Parent.Width - 20
            Height: =68

        lblCartItemName As label:
            Text: =ThisItem.ItemName
            Size: =14
            FontWeight: =FontWeight.Bold
            Color: =RGBA(30, 30, 30, 1)
            X: =20
            Y: =10
            Width: =Parent.Width - 180
            Height: =24

        lblCartUnitPrice As label:
            Text: |-
                =Char(165) & Text(ThisItem.UnitPrice, "#,##0") & " × "
            Size: =13
            Color: =RGBA(100, 100, 100, 1)
            X: =20
            Y: =38
            Width: =100
            Height: =22

        btnDecQty As button:
            Text: ="−"
            Fill: =RGBA(200, 200, 200, 1)
            Color: =RGBA(50, 50, 50, 1)
            BorderThickness: =0
            BorderRadius: =14
            Size: =16
            X: =120
            Y: =38
            Width: =28
            Height: =28
            OnSelect: |-
                =If(
                  ThisItem.Quantity <= 1,
                  RemoveIf(colCart, ItemID = ThisItem.ItemID),
                  UpdateIf(colCart, ItemID = ThisItem.ItemID, {Quantity: Quantity - 1, Subtotal: (Quantity - 1) * UnitPrice})
                );
                Set(gblTotalAmount, Sum(colCart, Subtotal))

        lblQty As label:
            Text: =Text(ThisItem.Quantity)
            Size: =16
            FontWeight: =FontWeight.Bold
            Color: =RGBA(30, 30, 30, 1)
            Align: =Align.Center
            X: =152
            Y: =38
            Width: =28
            Height: =28

        btnIncQty As button:
            Text: ="＋"
            Fill: =RGBA(41, 128, 185, 1)
            Color: =RGBA(255, 255, 255, 1)
            BorderThickness: =0
            BorderRadius: =14
            Size: =16
            X: =184
            Y: =38
            Width: =28
            Height: =28
            OnSelect: |-
                =UpdateIf(colCart, ItemID = ThisItem.ItemID, {Quantity: Quantity + 1, Subtotal: (Quantity + 1) * UnitPrice});
                Set(gblTotalAmount, Sum(colCart, Subtotal))

        lblSubtotal As label:
            Text: |-
                =Char(165) & Text(ThisItem.Subtotal, "#,##0")
            Size: =15
            FontWeight: =FontWeight.Bold
            Color: =RGBA(41, 128, 185, 1)
            Align: =Align.Right
            X: =Parent.Width - 110
            Y: =10
            Width: =90
            Height: =28

    lblMinOrder As label:
        Text: |-
            =If(gblTotalAmount < gblCurrentStore.MinimumOrder, "最低注文金額まであと " & Char(165) & Text(gblCurrentStore.MinimumOrder - gblTotalAmount, "#,##0"), "最低注文金額クリア！")
        Size: =12
        Color: =If(gblTotalAmount < gblCurrentStore.MinimumOrder, RGBA(231, 76, 60, 1), RGBA(46, 204, 113, 1))
        X: =15
        Y: =Parent.Height - 185
        Width: =Parent.Width - 30
        Height: =24

    lblTotal As label:
        Text: |-
            ="合計（税込）  " & Char(165) & Text(gblTotalAmount + gblCurrentStore.DeliveryFee, "#,##0")
        Size: =16
        FontWeight: =FontWeight.Bold
        Color: =RGBA(41, 128, 185, 1)
        X: =15
        Y: =Parent.Height - 155
        Width: =Parent.Width - 30
        Height: =36
        Align: =Align.Right

    lblDeliveryFeeNote As label:
        Text: |-
            ="（配達料 " & Char(165) & Text(gblCurrentStore.DeliveryFee, "#,##0") & " 含む）"
        Size: =12
        Color: =RGBA(120, 120, 120, 1)
        X: =15
        Y: =Parent.Height - 118
        Width: =Parent.Width - 30
        Height: =22
        Align: =Align.Right

    btnProceedToOrder As button:
        Text: ="注文内容を確認する"
        Fill: =If(gblTotalAmount >= gblCurrentStore.MinimumOrder, RGBA(41, 128, 185, 1), RGBA(190, 190, 190, 1))
        Color: =RGBA(255, 255, 255, 1)
        BorderThickness: =0
        BorderRadius: =10
        Size: =15
        FontWeight: =FontWeight.Bold
        X: =15
        Y: =Parent.Height - 88
        Width: =Parent.Width - 30
        Height: =50
        DisplayMode: =If(gblTotalAmount >= gblCurrentStore.MinimumOrder, DisplayMode.Edit, DisplayMode.Disabled)
        OnSelect: =Navigate(OrderConfirmScreen, ScreenTransition.Fade)
