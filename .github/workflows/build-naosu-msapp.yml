name: Build NAOSU msapp

on:
  push:
    branches:
      - agent/correction-photo-manager
      - agent/build-naosu-msapp
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Power Platform CLI
        run: dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version 1.34.4
      - name: Pack canvas app
        id: pack
        continue-on-error: true
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          find pac-source -maxdepth 3 -type f | sort > source-files.txt
          pac canvas pack --sources pac-source --msapp NAOSU.msapp > pack.log 2>&1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NAOSU-build-diagnostics
          path: |
            pack.log
            source-files.txt
          if-no-files-found: warn
      - name: Upload msapp
        if: steps.pack.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NAOSU-msapp
          path: NAOSU.msapp
          if-no-files-found: error
      - name: Fail when pack failed
        if: steps.pack.outcome != 'success'
        run: exit 1
