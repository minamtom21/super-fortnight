name: Build NAOSU msapp

on:
  push:
    branches:
      - agent/correction-photo-manager
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Power Platform CLI
        run: dotnet tool install --global Microsoft.PowerApps.CLI.Tool --version 1.34.4
      - name: Pack canvas app
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          pac canvas pack --sources pac-source --msapp NAOSU.msapp
      - name: Upload msapp
        uses: actions/upload-artifact@v4
        with:
          name: NAOSU-msapp
          path: NAOSU.msapp
          if-no-files-found: error
