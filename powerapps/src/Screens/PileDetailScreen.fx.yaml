PileDetailScreen As screen:
    Fill: =RGBA(244, 246, 249, 1)
    OnVisible: |
        =Set(varCurrentPile, LookUp(colPiles, PileId = varCurrentPileId))

    BackBtn As button:
        Text: ="← 杭一覧へ"
        X: =250
        Y: =84
        Width: =150
        Height: =36
        OnSelect: =Navigate(PilesScreen)

    PageTitle As label:
        Text: ="杭 " & varCurrentPile.No & "  ／  " & varCurrentPile.Type
        Size: =20
        FontWeight: =FontWeight.Semibold
        X: =410
        Y: =84
        Width: =700
        Height: =40

    EditPileBtn As button:
        Text: ="杭編集"
        X: =1080
        Y: =84
        Width: =100
        Height: =36
        OnSelect: |
            =Set(varEditingPile, varCurrentPile);
            Navigate(PileFormScreen)

    AddRecordBtn As button:
        Text: ="＋ 施工記録"
        X: =1190
        Y: =84
        Width: =140
        Height: =36
        Fill: =RGBA(200, 69, 31, 1)
        Color: =RGBA(255, 255, 255, 1)
        OnSelect: |
            =Set(varEditingRecord, Blank());
            Navigate(RecordFormScreen)

    InfoCard As rectangle:
        Fill: =RGBA(255, 255, 255, 1)
        BorderColor: =RGBA(226, 231, 238, 1)
        BorderThickness: =1
        X: =250
        Y: =140
        Width: =1080
        Height: =160

    InfoTitle As label:
        Text: ="杭情報"
        FontWeight: =FontWeight.Semibold
        Size: =14
        X: =266
        Y: =152
        Width: =400
        Height: =30

    InfoDiameterLabel As label:
        Text: ="杭径"
        Color: =RGBA(138, 150, 163, 1)
        Size: =10
        X: =266
        Y: =190
        Width: =160
        Height: =20
    InfoDiameterValue As label:
        Text: =varCurrentPile.Diameter & " mm"
        FontWeight: =FontWeight.Semibold
        X: =266
        Y: =210
        Width: =160
        Height: =26

    InfoLengthLabel As label:
        Text: ="杭長"
        Color: =RGBA(138, 150, 163, 1)
        Size: =10
        X: =446
        Y: =190
        Width: =160
        Height: =20
    InfoLengthValue As label:
        Text: =varCurrentPile.Length & " m"
        FontWeight: =FontWeight.Semibold
        X: =446
        Y: =210
        Width: =160
        Height: =26

    InfoBearingLabel As label:
        Text: ="支持層深度"
        Color: =RGBA(138, 150, 163, 1)
        Size: =10
        X: =626
        Y: =190
        Width: =160
        Height: =20
    InfoBearingValue As label:
        Text: =varCurrentPile.BearingDepth & " m"
        FontWeight: =FontWeight.Semibold
        X: =626
        Y: =210
        Width: =160
        Height: =26

    InfoLevelLabel As label:
        Text: ="設計杭頭レベル"
        Color: =RGBA(138, 150, 163, 1)
        Size: =10
        X: =806
        Y: =190
        Width: =160
        Height: =20
    InfoLevelValue As label:
        Text: =varCurrentPile.DesignLevel & " m"
        FontWeight: =FontWeight.Semibold
        X: =806
        Y: =210
        Width: =160
        Height: =26

    InfoCoordLabel As label:
        Text: ="設計杭芯 (X, Y)"
        Color: =RGBA(138, 150, 163, 1)
        Size: =10
        X: =986
        Y: =190
        Width: =200
        Height: =20
    InfoCoordValue As label:
        Text: ="(" & varCurrentPile.X & ", " & varCurrentPile.Y & ") mm"
        FontWeight: =FontWeight.Semibold
        X: =986
        Y: =210
        Width: =200
        Height: =26

    RecordsTitle As label:
        Text: ="施工記録"
        FontWeight: =FontWeight.Semibold
        Size: =14
        X: =250
        Y: =320
        Width: =400
        Height: =30

    RecordsGallery As gallery:
        TemplateSize: =56
        Items: =Sort(Filter(colRecords, PileId = varCurrentPileId), Date, Ascending)
        X: =250
        Y: =360
        Width: =1080
        Height: =350
        Fill: =RGBA(255, 255, 255, 1)
        BorderColor: =RGBA(226, 231, 238, 1)
        BorderThickness: =1

        RecDateLabel As label:
            Text: =Text(ThisItem.Date, "yyyy/mm/dd")
            X: =16
            Y: =16
            Width: =110
            Height: =24
            FontWeight: =FontWeight.Semibold

        RecDrillLabel As label:
            Text: ="削孔 " & Text(ThisItem.DrillDepth, "0.00") & "m"
            X: =126
            Y: =16
            Width: =140
            Height: =24

        RecDeviationLabel As label:
            Text: |
                ="ΔX " & ThisItem.DeviationX & " / ΔY " & ThisItem.DeviationY &
                " (" & Round(Sqrt(ThisItem.DeviationX*ThisItem.DeviationX + ThisItem.DeviationY*ThisItem.DeviationY), 0) & "mm)"
            X: =266
            Y: =16
            Width: =320
            Height: =24
            Color: |
                =If(
                    Sqrt(ThisItem.DeviationX*ThisItem.DeviationX + ThisItem.DeviationY*ThisItem.DeviationY) > varDeviationTolerance,
                    RGBA(192, 57, 43, 1),
                    RGBA(28, 39, 51, 1)
                )

        RecVerticalityLabel As label:
            Text: ="鉛直度 1/" & Round(1/ThisItem.Verticality, 0)
            X: =586
            Y: =16
            Width: =130
            Height: =24

        RecOperatorLabel As label:
            Text: =ThisItem.Operator
            X: =716
            Y: =16
            Width: =160
            Height: =24
            Color: =RGBA(90, 104, 120, 1)

        RecStatusLabel As label:
            Text: =If(ThisItem.Completed, "完了", "進行")
            X: =876
            Y: =16
            Width: =80
            Height: =24
            FontWeight: =FontWeight.Semibold
            Color: =If(ThisItem.Completed, RGBA(31, 110, 62, 1), RGBA(180, 92, 0, 1))

        EditRecordBtn As button:
            Text: ="編集"
            X: =980
            Y: =12
            Width: =80
            Height: =36
            OnSelect: |
                =Set(varEditingRecord, ThisItem);
                Navigate(RecordFormScreen)
