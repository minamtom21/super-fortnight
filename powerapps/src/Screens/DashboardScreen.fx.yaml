DashboardScreen As screen:
    Fill: =RGBA(244, 246, 249, 1)

    Header As rectangle:
        Fill: =RGBA(28, 39, 51, 1)
        X: =0
        Y: =0
        Width: =Parent.Width
        Height: =60

    HeaderBrand As label:
        Text: ="PowerUps  ／  杭工事管理システム"
        Color: =RGBA(255, 255, 255, 1)
        FontWeight: =FontWeight.Bold
        Size: =18
        X: =20
        Y: =14
        Width: =500
        Height: =32

    HeaderAccent As rectangle:
        Fill: =RGBA(200, 69, 31, 1)
        X: =0
        Y: =57
        Width: =Parent.Width
        Height: =3

    NavSidebar As rectangle:
        Fill: =RGBA(255, 255, 255, 1)
        X: =0
        Y: =60
        Width: =220
        Height: =Parent.Height - 60

    NavDashboardBtn As button:
        Text: ="●  ダッシュボード"
        OnSelect: =Navigate(DashboardScreen)
        X: =0
        Y: =76
        Width: =220
        Height: =40
        Fill: =RGBA(253, 241, 236, 1)
        Color: =RGBA(156, 52, 22, 1)
        Align: =Align.Left
        PaddingLeft: =20

    NavProjectsBtn As button:
        Text: ="■  案件管理"
        OnSelect: =Navigate(ProjectsScreen)
        X: =0
        Y: =116
        Width: =220
        Height: =40
        Fill: =RGBA(255, 255, 255, 1)
        Color: =RGBA(28, 39, 51, 1)
        Align: =Align.Left
        PaddingLeft: =20

    NavPilesBtn As button:
        Text: ="▣  杭一覧"
        OnSelect: =Navigate(PilesScreen)
        X: =0
        Y: =156
        Width: =220
        Height: =40
        Fill: =RGBA(255, 255, 255, 1)
        Color: =RGBA(28, 39, 51, 1)
        Align: =Align.Left
        PaddingLeft: =20

    NavLayoutBtn As button:
        Text: ="◇  杭芯配置図"
        OnSelect: =Navigate(LayoutScreen)
        X: =0
        Y: =196
        Width: =220
        Height: =40
        Fill: =RGBA(255, 255, 255, 1)
        Color: =RGBA(28, 39, 51, 1)
        Align: =Align.Left
        PaddingLeft: =20

    NavReportsBtn As button:
        Text: ="≡  帳票出力"
        OnSelect: =Navigate(ReportsScreen)
        X: =0
        Y: =236
        Width: =220
        Height: =40
        Fill: =RGBA(255, 255, 255, 1)
        Color: =RGBA(28, 39, 51, 1)
        Align: =Align.Left
        PaddingLeft: =20

    PageTitle As label:
        Text: ="ダッシュボード"
        Size: =22
        FontWeight: =FontWeight.Semibold
        X: =250
        Y: =84
        Width: =400
        Height: =40

    KpiProjectsBox As rectangle:
        Fill: =RGBA(255, 255, 255, 1)
        BorderColor: =RGBA(226, 231, 238, 1)
        BorderThickness: =1
        X: =250
        Y: =140
        Width: =200
        Height: =100

    KpiProjectsAccent As rectangle:
        Fill: =RGBA(200, 69, 31, 1)
        X: =250
        Y: =140
        Width: =200
        Height: =3

    KpiProjectsLabel As label:
        Text: ="案件数"
        Size: =10
        Color: =RGBA(138, 150, 163, 1)
        X: =260
        Y: =150
        Width: =180
        Height: =20

    KpiProjectsValue As label:
        Text: =CountRows(colProjects) & " 件"
        Size: =28
        FontWeight: =FontWeight.Bold
        X: =260
        Y: =170
        Width: =180
        Height: =60

    KpiPilesBox As rectangle:
        Fill: =RGBA(255, 255, 255, 1)
        BorderColor: =RGBA(226, 231, 238, 1)
        BorderThickness: =1
        X: =470
        Y: =140
        Width: =200
        Height: =100

    KpiPilesAccent As rectangle:
        Fill: =RGBA(30, 96, 145, 1)
        X: =470
        Y: =140
        Width: =200
        Height: =3

    KpiPilesLabel As label:
        Text: ="登録杭数"
        Size: =10
        Color: =RGBA(138, 150, 163, 1)
        X: =480
        Y: =150
        Width: =180
        Height: =20

    KpiPilesValue As label:
        Text: =CountRows(colPiles) & " 本"
        Size: =28
        FontWeight: =FontWeight.Bold
        X: =480
        Y: =170
        Width: =180
        Height: =60

    KpiCompletedBox As rectangle:
        Fill: =RGBA(255, 255, 255, 1)
        BorderColor: =RGBA(226, 231, 238, 1)
        BorderThickness: =1
        X: =690
        Y: =140
        Width: =200
        Height: =100

    KpiCompletedAccent As rectangle:
        Fill: =RGBA(46, 139, 87, 1)
        X: =690
        Y: =140
        Width: =200
        Height: =3

    KpiCompletedLabel As label:
        Text: ="完了"
        Size: =10
        Color: =RGBA(138, 150, 163, 1)
        X: =700
        Y: =150
        Width: =180
        Height: =20

    KpiCompletedValue As label:
        Text: =CountRows(Filter(colRecords, Completed)) & " 件"
        Size: =28
        FontWeight: =FontWeight.Bold
        X: =700
        Y: =170
        Width: =180
        Height: =60

    KpiAlertBox As rectangle:
        Fill: =RGBA(255, 255, 255, 1)
        BorderColor: =RGBA(226, 231, 238, 1)
        BorderThickness: =1
        X: =910
        Y: =140
        Width: =200
        Height: =100

    KpiAlertAccent As rectangle:
        Fill: =RGBA(192, 57, 43, 1)
        X: =910
        Y: =140
        Width: =200
        Height: =3

    KpiAlertLabel As label:
        Text: ="許容超過"
        Size: =10
        Color: =RGBA(138, 150, 163, 1)
        X: =920
        Y: =150
        Width: =180
        Height: =20

    KpiAlertValue As label:
        Text: |
            =CountRows(
                Filter(
                    colRecords,
                    Sqrt(DeviationX*DeviationX + DeviationY*DeviationY) > varDeviationTolerance
                )
            ) & " 件"
        Size: =28
        FontWeight: =FontWeight.Bold
        Color: =RGBA(192, 57, 43, 1)
        X: =920
        Y: =170
        Width: =180
        Height: =60

    RecentRecordsTitle As label:
        Text: ="直近の施工記録"
        Size: =14
        FontWeight: =FontWeight.Semibold
        X: =250
        Y: =270
        Width: =400
        Height: =30

    RecentRecordsGallery As gallery:
        TemplateSize: =44
        Items: =Sort(colRecords, Date, Descending)
        X: =250
        Y: =310
        Width: =1080
        Height: =400
        BorderColor: =RGBA(226, 231, 238, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)

        DateLabel As label:
            Text: =Text(ThisItem.Date, "yyyy/mm/dd")
            X: =16
            Y: =10
            Width: =100
            Height: =24

        PileNoLabel As label:
            Text: =ThisItem.PileId
            X: =116
            Y: =10
            Width: =120
            Height: =24
            FontWeight: =FontWeight.Semibold

        DeviationLabel As label:
            Text: |
                ="ΔX:" & ThisItem.DeviationX & " ΔY:" & ThisItem.DeviationY &
                " (合成:" & Round(Sqrt(ThisItem.DeviationX*ThisItem.DeviationX + ThisItem.DeviationY*ThisItem.DeviationY), 0) & "mm)"
            X: =236
            Y: =10
            Width: =360
            Height: =24
            Color: |
                =If(
                    Sqrt(ThisItem.DeviationX*ThisItem.DeviationX + ThisItem.DeviationY*ThisItem.DeviationY) > varDeviationTolerance,
                    RGBA(192, 57, 43, 1),
                    RGBA(28, 39, 51, 1)
                )

        OperatorLabel As label:
            Text: =ThisItem.Operator
            X: =606
            Y: =10
            Width: =160
            Height: =24
            Color: =RGBA(90, 104, 120, 1)

        StatusLabel As label:
            Text: =If(ThisItem.Completed, "完了", "進行中")
            X: =766
            Y: =10
            Width: =80
            Height: =24
            Color: =If(ThisItem.Completed, RGBA(31, 110, 62, 1), RGBA(180, 92, 0, 1))
            FontWeight: =FontWeight.Semibold

        OpenButton As button:
            Text: ="詳細"
            X: =980
            Y: =6
            Width: =80
            Height: =32
            OnSelect: |
                =Set(varCurrentPileId, ThisItem.PileId);
                Navigate(PileDetailScreen)
