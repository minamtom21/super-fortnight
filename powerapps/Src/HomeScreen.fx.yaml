
# =====================================================================
# HomeScreen (ホーム画面)
# カテゴリ選択 → 店舗一覧 → 注文への入口
# =====================================================================

HomeScreen As screen.screen:
  Fill: =RGBA(245, 247, 250, 1)

  # ---- ヘッダー ----
  rectHeader As rectangle:
    Fill: =RGBA(41, 128, 185, 1)
    X: =0
    Y: =0
    Width: =Parent.Width
    Height: =100

  lblAppTitle As label:
    Text: ="🍱 南部市場 出前"
    FontSize: =22
    FontWeight: =FontWeight.Bold
    Color: =RGBA(255, 255, 255, 1)
    X: =20
    Y: =25
    Width: =Parent.Width - 100
    Height: =50

  lblSubtitle As label:
    Text: ="横浜市金沢区 南部市場周辺"
    FontSize: =12
    Color: =RGBA(200, 230, 255, 1)
    X: =20
    Y: =65
    Width: =300
    Height: =25

  # ---- 検索バー ----
  rectSearch As rectangle:
    Fill: =RGBA(255, 255, 255, 1)
    BorderColor: =RGBA(200, 200, 200, 1)
    BorderThickness: =1
    BorderRadiusTopLeft: =20
    BorderRadiusTopRight: =20
    BorderRadiusBottomLeft: =20
    BorderRadiusBottomRight: =20
    X: =15
    Y: =110
    Width: =Parent.Width - 30
    Height: =45

  lblSearchIcon As label:
    Text: ="🔍"
    X: =25
    Y: =118
    Width: =30
    Height: =30

  txtSearch As textInput:
    Default: =""
    PlaceholderText: ="お店・料理名で検索"
    FontSize: =14
    BorderThickness: =0
    X: =58
    Y: =112
    Width: =Parent.Width - 90
    Height: =40

  # ---- カテゴリタイトル ----
  lblCategoryTitle As label:
    Text: ="カテゴリから選ぶ"
    FontSize: =16
    FontWeight: =FontWeight.Bold
    Color: =RGBA(50, 50, 50, 1)
    X: =15
    Y: =168
    Width: =200
    Height: =30

  # ---- カテゴリ グリッド (Gallery) ----
  galCategories As gallery.BrowseLayout:
    Items: =Categories
    Layout: =Layout.Grid
    WrapCount: =4
    TemplateWidth: =(Parent.Width - 30) / 4
    TemplateHeight: =90
    X: =15
    Y: =205
    Width: =Parent.Width - 30
    Height: =200
    ShowScrollbar: =false

    # --- カテゴリカード ---
    rectCategoryCard As rectangle:
      Fill: =RGBA(255, 255, 255, 1)
      BorderColor: =RGBA(220, 220, 220, 1)
      BorderThickness: =1
      BorderRadiusTopLeft: =12
      BorderRadiusTopRight: =12
      BorderRadiusBottomLeft: =12
      BorderRadiusBottomRight: =12
      Width: =Parent.TemplateWidth - 8
      Height: =80
      X: =4
      Y: =5

    lblCategoryIcon As label:
      Text: =ThisItem.Icon
      FontSize: =28
      Align: =Align.Center
      X: =4
      Y: =8
      Width: =Parent.TemplateWidth - 8
      Height: =40

    lblCategoryName As label:
      Text: =ThisItem.CategoryName
      FontSize: =11
      Align: =Align.Center
      Color: =RGBA(60, 60, 60, 1)
      X: =4
      Y: =50
      Width: =Parent.TemplateWidth - 8
      Height: =28

    btnCategory As button:
      Text: =""
      Fill: =RGBA(0, 0, 0, 0)
      BorderThickness: =0
      Width: =Parent.TemplateWidth - 8
      Height: =80
      X: =4
      Y: =5
      OnSelect: |
        =Set(gblSelectedCategory, ThisItem);
        Navigate(StoreListScreen, ScreenTransition.Fade)

  # ---- 近くの人気店 ----
  lblPopularTitle As label:
    Text: ="近くの人気店"
    FontSize: =16
    FontWeight: =FontWeight.Bold
    Color: =RGBA(50, 50, 50, 1)
    X: =15
    Y: =415
    Width: =200
    Height: =30

  # ---- 人気店 Gallery ----
  galPopularStores As gallery.BrowseLayout:
    Items: =Sort(Filter(Stores, IsOpen = true), Rating, SortOrder.Descending)
    Layout: =Layout.Horizontal
    TemplateWidth: =220
    TemplateHeight: =210
    X: =0
    Y: =450
    Width: =Parent.Width
    Height: =220
    ShowScrollbar: =false

    rectStoreCard As rectangle:
      Fill: =RGBA(255, 255, 255, 1)
      BorderColor: =RGBA(230, 230, 230, 1)
      BorderThickness: =1
      BorderRadiusTopLeft: =12
      BorderRadiusTopRight: =12
      BorderRadiusBottomLeft: =12
      BorderRadiusBottomRight: =12
      Width: =210
      Height: =200
      X: =5
      Y: =5

    imgStoreThumb As image:
      Image: =ThisItem.ImageURL
      Width: =210
      Height: =120
      X: =5
      Y: =5
      BorderRadiusTopLeft: =12
      BorderRadiusTopRight: =12

    lblStoreName As label:
      Text: =ThisItem.StoreName
      FontSize: =13
      FontWeight: =FontWeight.Bold
      Color: =RGBA(40, 40, 40, 1)
      X: =10
      Y: =130
      Width: =195
      Height: =25

    lblStoreCategory As label:
      Text: =ThisItem.CategoryName & " • 🚚 " & ThisItem.DeliveryTimeMin & "〜" & ThisItem.DeliveryTimeMax & "分"
      FontSize: =11
      Color: =RGBA(120, 120, 120, 1)
      X: =10
      Y: =155
      Width: =195
      Height: =20

    lblRating As label:
      Text: ="⭐ " & Text(ThisItem.Rating, "[$-ja-JP]0.0") & "  最低" & Text(ThisItem.MinimumOrder, "[$-ja-JP]#,##0") & "円〜"
      FontSize: =11
      Color: =RGBA(230, 126, 34, 1)
      X: =10
      Y: =175
      Width: =195
      Height: =20

    btnStore As button:
      Text: =""
      Fill: =RGBA(0, 0, 0, 0)
      BorderThickness: =0
      Width: =210
      Height: =200
      X: =5
      Y: =5
      OnSelect: |
        =Set(gblCurrentStore, ThisItem);
        Navigate(MenuScreen, ScreenTransition.Fade)

  # ---- 注文履歴ボタン ----
  btnOrderHistory As button:
    Text: ="📋 注文履歴を見る"
    Fill: =RGBA(255, 255, 255, 1)
    BorderColor: =RGBA(41, 128, 185, 1)
    BorderThickness: =2
    Color: =RGBA(41, 128, 185, 1)
    FontSize: =14
    BorderRadiusTopLeft: =8
    BorderRadiusTopRight: =8
    BorderRadiusBottomLeft: =8
    BorderRadiusBottomRight: =8
    X: =15
    Y: =685
    Width: =Parent.Width - 30
    Height: =48
    OnSelect: =Navigate(OrderHistoryScreen, ScreenTransition.Fade)
