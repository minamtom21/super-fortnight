
# =====================================================================
# StoreListScreen (店舗一覧画面)
# カテゴリ/テキスト検索で絞り込まれた店舗一覧を表示
# =====================================================================

StoreListScreen As screen.screen:
  Fill: =RGBA(245, 247, 250, 1)

  # ---- ヘッダー ----
  rectHeader As rectangle:
    Fill: =RGBA(41, 128, 185, 1)
    X: =0
    Y: =0
    Width: =Parent.Width
    Height: =80

  btnBack As button:
    Text: ="← 戻る"
    Fill: =RGBA(0, 0, 0, 0)
    Color: =RGBA(255, 255, 255, 1)
    BorderThickness: =0
    FontSize: =14
    X: =5
    Y: =22
    Width: =80
    Height: =36
    OnSelect: =Navigate(HomeScreen, ScreenTransition.Fade)

  lblScreenTitle As label:
    Text: =If(IsBlank(gblSelectedCategory), "全てのお店", gblSelectedCategory.Icon & " " & gblSelectedCategory.CategoryName)
    FontSize: =18
    FontWeight: =FontWeight.Bold
    Color: =RGBA(255, 255, 255, 1)
    X: =90
    Y: =22
    Width: =Parent.Width - 180
    Height: =36
    Align: =Align.Center

  # ---- 絞り込みバー ----
  rectFilterBar As rectangle:
    Fill: =RGBA(255, 255, 255, 1)
    BorderColor: =RGBA(210, 210, 210, 1)
    BorderThickness: =0
    X: =0
    Y: =80
    Width: =Parent.Width
    Height: =50

  txtFilter As textInput:
    Default: =""
    PlaceholderText: ="店名・料理名で絞り込み"
    FontSize: =13
    BorderColor: =RGBA(200, 200, 200, 1)
    BorderThickness: =1
    BorderRadiusTopLeft: =20
    BorderRadiusTopRight: =20
    BorderRadiusBottomLeft: =20
    BorderRadiusBottomRight: =20
    X: =15
    Y: =88
    Width: =Parent.Width - 30
    Height: =34

  # ---- ソートボタン ----
  lblSortBy As label:
    Text: ="並び替え:"
    FontSize: =12
    Color: =RGBA(100, 100, 100, 1)
    X: =15
    Y: =132
    Width: =70
    Height: =28

  btnSortRating As button:
    Text: ="評価順"
    Fill: =If(gblSortMode="rating", RGBA(41,128,185,1), RGBA(240,240,240,1))
    Color: =If(gblSortMode="rating", RGBA(255,255,255,1), RGBA(80,80,80,1))
    BorderThickness: =0
    BorderRadiusTopLeft: =14
    BorderRadiusTopRight: =14
    BorderRadiusBottomLeft: =14
    BorderRadiusBottomRight: =14
    FontSize: =12
    X: =90
    Y: =132
    Width: =72
    Height: =28
    OnSelect: =Set(gblSortMode, "rating")

  btnSortDelivery As button:
    Text: ="配達時間順"
    Fill: =If(gblSortMode="delivery", RGBA(41,128,185,1), RGBA(240,240,240,1))
    Color: =If(gblSortMode="delivery", RGBA(255,255,255,1), RGBA(80,80,80,1))
    BorderThickness: =0
    BorderRadiusTopLeft: =14
    BorderRadiusTopRight: =14
    BorderRadiusBottomLeft: =14
    BorderRadiusBottomRight: =14
    FontSize: =12
    X: =168
    Y: =132
    Width: =88
    Height: =28
    OnSelect: =Set(gblSortMode, "delivery")

  btnSortFee As button:
    Text: ="送料順"
    Fill: =If(gblSortMode="fee", RGBA(41,128,185,1), RGBA(240,240,240,1))
    Color: =If(gblSortMode="fee", RGBA(255,255,255,1), RGBA(80,80,80,1))
    BorderThickness: =0
    BorderRadiusTopLeft: =14
    BorderRadiusTopRight: =14
    BorderRadiusBottomLeft: =14
    BorderRadiusBottomRight: =14
    FontSize: =12
    X: =262
    Y: =132
    Width: =72
    Height: =28
    OnSelect: =Set(gblSortMode, "fee")

  # ---- 店舗一覧 Gallery ----
  galStores As gallery.BrowseLayout:
    Items: |
      =Sort(
        Filter(
          Stores,
          IsOpen = true,
          If(IsBlank(gblSelectedCategory), true, CategoryID = gblSelectedCategory.CategoryID),
          If(IsBlank(txtFilter.Text), true,
             Or(StoreName in txtFilter.Text, CategoryName in txtFilter.Text, Tags in txtFilter.Text)
          )
        ),
        Switch(gblSortMode,
          "rating",   Rating,
          "delivery", DeliveryTimeMin,
          "fee",      DeliveryFee,
          Rating
        ),
        If(gblSortMode="rating", SortOrder.Descending, SortOrder.Ascending)
      )
    Layout: =Layout.Vertical
    TemplateHeight: =130
    X: =0
    Y: =168
    Width: =Parent.Width
    Height: =Parent.Height - 168

    # --- 店舗カード ---
    rectCard As rectangle:
      Fill: =RGBA(255, 255, 255, 1)
      BorderColor: =RGBA(230, 230, 230, 1)
      BorderThickness: =1
      BorderRadiusTopLeft: =10
      BorderRadiusTopRight: =10
      BorderRadiusBottomLeft: =10
      BorderRadiusBottomRight: =10
      X: =10
      Y: =5
      Width: =Parent.Width - 20
      Height: =118

    imgStore As image:
      Image: =ThisItem.ImageURL
      X: =10
      Y: =5
      Width: =100
      Height: =118
      BorderRadiusTopLeft: =10
      BorderRadiusBottomLeft: =10

    lblName As label:
      Text: =ThisItem.StoreName
      FontSize: =14
      FontWeight: =FontWeight.Bold
      Color: =RGBA(30, 30, 30, 1)
      X: =120
      Y: =12
      Width: =Parent.Width - 140
      Height: =24

    lblCat As label:
      Text: =ThisItem.Icon & " " & ThisItem.CategoryName
      FontSize: =12
      Color: =RGBA(100, 100, 100, 1)
      X: =120
      Y: =38
      Width: =Parent.Width - 140
      Height: =20

    lblDelivery As label:
      Text: ="🚚 " & ThisItem.DeliveryTimeMin & "〜" & ThisItem.DeliveryTimeMax & "分  💴 送料" & If(ThisItem.DeliveryFee=0, "無料", Text(ThisItem.DeliveryFee,"#,##0") & "円")
      FontSize: =11
      Color: =RGBA(80, 80, 80, 1)
      X: =120
      Y: =60
      Width: =Parent.Width - 140
      Height: =20

    lblMinOrder As label:
      Text: ="最低注文金額: " & Text(ThisItem.MinimumOrder, "#,##0") & "円〜"
      FontSize: =11
      Color: =RGBA(120, 120, 120, 1)
      X: =120
      Y: =82
      Width: =Parent.Width - 140
      Height: =20

    lblRatingStar As label:
      Text: ="⭐ " & Text(ThisItem.Rating, "0.0") & " (" & Text(ThisItem.ReviewCount, "#,##0") & "件)"
      FontSize: =12
      Color: =RGBA(230, 126, 34, 1)
      X: =120
      Y: =100
      Width: =Parent.Width - 140
      Height: =20

    btnSelectStore As button:
      Text: =""
      Fill: =RGBA(0, 0, 0, 0)
      BorderThickness: =0
      X: =10
      Y: =5
      Width: =Parent.Width - 20
      Height: =118
      OnSelect: |
        =Set(gblCurrentStore, ThisItem);
        Navigate(MenuScreen, ScreenTransition.Fade)
