<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PowerUps｜杭工事管理システム</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand">
        <span class="brand-mark">P</span>
        <span class="brand-text">
          <strong>PowerUps</strong>
          <small>杭工事管理システム</small>
        </span>
      </a>
      <div class="topbar-right">
        <span id="currentProjectLabel" class="current-project"></span>
        <span class="user-chip">管理者</span>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav class="sidenav">
        <a href="#/" data-nav="dashboard"><span class="ico">●</span>ダッシュボード</a>
        <a href="#/projects" data-nav="projects"><span class="ico">■</span>案件管理</a>
        <a href="#/piles" data-nav="piles"><span class="ico">▣</span>杭一覧</a>
        <a href="#/records" data-nav="records"><span class="ico">▤</span>施工記録</a>
        <a href="#/layout" data-nav="layout"><span class="ico">◇</span>杭芯配置図</a>
        <a href="#/reports" data-nav="reports"><span class="ico">≡</span>帳票出力</a>
        <a href="#/settings" data-nav="settings"><span class="ico">⚙</span>設定</a>
      </nav>
      <div class="sidebar-foot">
        <small>v0.1.0 internal</small>
      </div>
    </aside>

    <main id="app" class="main"><!-- rendered by app.js --></main>
  </div>

  <footer class="footer">
    <small>PowerUps — 自社内 杭工事管理ツール</small>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
