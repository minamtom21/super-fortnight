SizesScreen As screen:
    Fill: =RGBA(245,247,250,1)
    Height: =Max(App.Height, App.DesignHeight)
    Width: =Max(App.Width, App.DesignWidth)

    AS_Header As label:
        Height: =64
        Width: =Parent.Width
        Fill: =RGBA(34,92,145,1)
        Text: ="対応中の是正  " & CountRows(colActive) & "件"
        Color: =RGBA(255,255,255,1)
        Size: =20
        FontWeight: =FontWeight.Bold
        PaddingLeft: =20

    AS_HomeBtn As button:
        X: =Parent.Width-100
        Y: =12
        Width: =80
        Height: =40
        Text: ="ホーム"
        Fill: =RGBA(90,98,106,1)
        OnSelect: =Navigate(StoreSelectScreen, ScreenTransition.Fade)

    AS_SearchInput As text:
        X: =20
        Y: =82
        Width: =Parent.Width-40
        Height: =44
        Default: =""
        HintText: ="工事名・場所・工種・指摘内容で検索"

    AS_ActiveGallery As gallery.vertical:
        X: =20
        Y: =142
        Width: =Parent.Width-40
        Height: =Parent.Height-162
        TemplateSize: =170
        Items: =Filter(colActive, IsBlank(AS_SearchInput.Text) || AS_SearchInput.Text in Site || AS_SearchInput.Text in Location || AS_SearchInput.Text in Trade || AS_SearchInput.Text in Issue)

        AS_Card As label:
            X: =0
            Y: =4
            Width: =Parent.TemplateWidth
            Height: =156
            Fill: =RGBA(255,255,255,1)
            Text: =""
            BorderColor: =RGBA(215,220,225,1)
            BorderThickness: =1

        AS_Title As label:
            X: =12
            Y: =12
            Width: =Parent.TemplateWidth-24
            Height: =30
            Text: =ThisItem.ID & "  " & ThisItem.Site
            FontWeight: =FontWeight.Bold
            Size: =14

        AS_Detail As label:
            X: =12
            Y: =44
            Width: =Parent.TemplateWidth-24
            Height: =62
            Text: =ThisItem.Location & "／" & ThisItem.Trade & Char(10) & ThisItem.Issue
            Size: =12

        AS_Due As label:
            X: =12
            Y: =108
            Width: =180
            Height: =34
            Text: ="期限：" & Text(ThisItem.DueDate,"yyyy/mm/dd")
            Color: =If(ThisItem.DueDate<Today(),RGBA(184,24,35,1),RGBA(70,78,86,1))
            FontWeight: =FontWeight.Bold

        AS_CompleteBtn As button:
            X: =Parent.TemplateWidth-132
            Y: =106
            Width: =120
            Height: =40
            Text: ="是正完了"
            Fill: =RGBA(34,140,87,1)
            OnSelect: |-
                =Collect(colCompleted,
                    Patch(ThisItem,
                        {
                            Status: "完了",
                            Action: "是正完了（簡易登録）",
                            CompletedAt: Now()
                        }
                    )
                );
                Remove(colActive, ThisItem);
                Notify("完了保管庫へ移動しました", NotificationType.Success)
