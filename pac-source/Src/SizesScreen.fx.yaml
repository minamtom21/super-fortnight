SizesScreen As screen:
    Fill: =RGBA(245,247,250,1)
    Height: =Max(App.Height, App.DesignHeight)
    Width: =Max(App.Width, App.DesignWidth)

    ActiveHeader As label:
        Height: =64
        Width: =Parent.Width
        Fill: =RGBA(34,92,145,1)
        Text: ="対応中の是正  " & CountRows(colActive) & "件"
        Color: =RGBA(255,255,255,1)
        Size: =20
        FontWeight: =FontWeight.Bold
        PaddingLeft: =20

    ActiveHomeBtn As button:
        X: =Parent.Width-100
        Y: =12
        Width: =80
        Height: =40
        Text: ="ホーム"
        Fill: =RGBA(90,98,106,1)
        OnSelect: =Navigate(StoreSelectScreen, ScreenTransition.Fade)

    ActiveInfo As label:
        X: =20
        Y: =100
        Width: =Parent.Width-40
        Height: =220
        Fill: =RGBA(255,255,255,1)
        BorderColor: =RGBA(215,220,225,1)
        BorderThickness: =1
        PaddingLeft: =16
        PaddingTop: =16
        Size: =14
        Text: =If(IsEmpty(colActive),"対応中の是正はありません。",First(colActive).ID & "  " & First(colActive).Site & Char(10) & First(colActive).Location & "／" & First(colActive).Trade & Char(10) & First(colActive).Issue & Char(10) & "期限：" & Text(First(colActive).DueDate,"yyyy/mm/dd"))

    ActiveCompleteBtn As button:
        X: =20
        Y: =350
        Width: =Parent.Width-40
        Height: =60
        Text: ="先頭の是正を完了にする"
        Fill: =RGBA(34,140,87,1)
        Color: =RGBA(255,255,255,1)
        DisplayMode: =If(IsEmpty(colActive),DisplayMode.Disabled,DisplayMode.Edit)
        OnSelect: |-
            =Collect(colCompleted,
                Patch(First(colActive),
                    {
                        Status: "完了",
                        Action: "是正完了（簡易登録）",
                        CompletedAt: Now()
                    }
                )
            );
            Remove(colActive, First(colActive));
            Notify("完了保管庫へ移動しました", NotificationType.Success)

    ActiveHint As label:
        X: =20
        Y: =430
        Width: =Parent.Width-40
        Height: =100
        Text: ="この安定版では、対応中データを登録順に表示します。SharePoint接続版では一覧表示と写真管理へ拡張できます。"
        Size: =13
        Color: =RGBA(90,98,106,1)
