CheckoutScreen As screen:
    Fill: =RGBA(255, 248, 240, 1)

    HeaderRect As rectangle:
        X: =0
        Y: =0
        Width: =Parent.Width
        Height: =56
        Fill: =RGBA(200, 57, 47, 1)

    BackButton As button:
        X: =8
        Y: =10
        Width: =60
        Height: =36
        Text: ="< 戻る"
        Fill: =RGBA(200, 57, 47, 1)
        Color: =RGBA(255, 255, 255, 1)
        OnSelect: =Navigate(CartScreen, ScreenTransition.UnCover)

    TitleLabel As label:
        X: =72
        Y: =12
        Width: =Parent.Width - 144
        Height: =32
        Text: ="お届け先・お支払い"
        Color: =RGBA(255, 255, 255, 1)
        Size: =16
        FontWeight: =FontWeight.Bold

    NameInput As text:
        X: =16
        Y: =80
        Width: =Parent.Width - 32
        Height: =40
        HintText: ="お名前"
        Default: =""

    PhoneInput As text:
        X: =16
        Y: =128
        Width: =Parent.Width - 32
        Height: =40
        HintText: ="電話番号 (例: 045-123-4567)"
        Default: =""

    AreaDropdown As dropdown:
        X: =16
        Y: =176
        Width: =Parent.Width - 32
        Height: =40
        Items: =colDeliveryAreas

    AddressInput As text:
        X: =16
        Y: =224
        Width: =Parent.Width - 32
        Height: =40
        HintText: ="建物名・部屋番号"
        Default: =""

    TimeDropdown As dropdown:
        X: =16
        Y: =272
        Width: =Parent.Width - 32
        Height: =40
        Items: =colDeliveryTimes

    PaymentDropdown As dropdown:
        X: =16
        Y: =320
        Width: =Parent.Width - 32
        Height: =40
        Items: =colPaymentMethods

    NoteInput As text:
        X: =16
        Y: =368
        Width: =Parent.Width - 32
        Height: =72
        HintText: ="備考（アレルギー等）"
        Mode: =TextMode.MultiLine
        Default: =""

    SubtotalLabel As label:
        X: =16
        Y: =452
        Width: =Parent.Width - 32
        Height: =22
        Text: =Concatenate("小計  ¥", Text(Sum(colCart, LineTotal), "[$-ja-JP]#,##0"))

    DiscountLabel As label:
        X: =16
        Y: =476
        Width: =Parent.Width - 32
        Height: =22
        Text: =Concatenate("割引  -¥", Text(varDiscount, "[$-ja-JP]#,##0"))
        Visible: =varDiscount > 0
        Color: =RGBA(200, 57, 47, 1)

    TotalLabel As label:
        X: =16
        Y: =502
        Width: =Parent.Width - 32
        Height: =28
        Text: =Concatenate("合計  ¥", Text(Max(0, Sum(colCart, LineTotal) - varDiscount), "[$-ja-JP]#,##0"))
        Size: =16
        FontWeight: =FontWeight.Bold

    SubmitButton As button:
        X: =16
        Y: =Parent.Height - 72
        Width: =Parent.Width - 32
        Height: =56
        Text: ="注文を確定する"
        Fill: =RGBA(200, 57, 47, 1)
        Color: =RGBA(255, 255, 255, 1)
        Size: =16
        FontWeight: =FontWeight.Bold
        DisplayMode: =If(
            IsBlank(NameInput.Text) Or IsBlank(PhoneInput.Text) Or IsBlank(AreaDropdown.Selected.AreaName) Or IsBlank(AddressInput.Text),
            DisplayMode.Disabled,
            DisplayMode.Edit
        )
        OnSelect: =Collect(
            colOrders,
            {
                OrderNumber: Concatenate("MM-", Text(Now(), "yyyymmdd"), "-", Text(RandBetween(1000, 9999))),
                PlacedAt: Now(),
                CustomerName: NameInput.Text,
                Phone: PhoneInput.Text,
                Area: AreaDropdown.Selected.AreaName,
                Address: AddressInput.Text,
                DeliveryTime: TimeDropdown.Selected.Label,
                Payment: PaymentDropdown.Selected.Label,
                Note: NoteInput.Text,
                Subtotal: Sum(colCart, LineTotal),
                CouponCode: If(IsBlank(varCoupon), "", varCoupon.Code),
                Discount: varDiscount,
                Total: Max(0, Sum(colCart, LineTotal) - varDiscount)
            }
        ) ;; Set(varLastOrder, Last(colOrders)) ;; Clear(colCart) ;; Set(varCoupon, Blank()) ;; Set(varDiscount, 0) ;; Navigate(ConfirmScreen, ScreenTransition.Fade)
