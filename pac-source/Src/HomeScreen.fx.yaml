HomeScreen As screen:
    Fill: =RGBA(245,247,250,1)
    Height: =Max(App.Height, App.DesignHeight)
    Width: =Max(App.Width, App.DesignWidth)

    Header As label:
        Height: =64
        Width: =Parent.Width
        Fill: =RGBA(184,24,35,1)
        Text: ="新しい是正を登録"
        Color: =RGBA(255,255,255,1)
        Size: =20
        FontWeight: =FontWeight.Bold
        PaddingLeft: =20

    Back As button:
        X: =Parent.Width-100
        Y: =12
        Width: =80
        Height: =40
        Text: ="戻る"
        Fill: =RGBA(120,125,130,1)
        OnSelect: =Back()

    SiteLabel As label:
        X: =20
        Y: =82
        Width: =120
        Height: =30
        Text: ="工事名"
    SiteInput As text:
        X: =20
        Y: =112
        Width: =Parent.Width-40
        Height: =44
        Default: =""
        HintText: ="例：横浜駅東口計画"

    LocationLabel As label:
        X: =20
        Y: =170
        Width: =120
        Height: =30
        Text: ="場所"
    LocationInput As text:
        X: =20
        Y: =200
        Width: =Parent.Width-40
        Height: =44
        Default: =""
        HintText: ="例：3階 東側廊下"

    TradeLabel As label:
        X: =20
        Y: =258
        Width: =120
        Height: =30
        Text: ="工種"
    TradeInput As text:
        X: =20
        Y: =288
        Width: =Parent.Width-40
        Height: =44
        Default: =""
        HintText: ="例：内装"

    IssueLabel As label:
        X: =20
        Y: =346
        Width: =160
        Height: =30
        Text: ="指摘内容"
    IssueInput As text:
        X: =20
        Y: =376
        Width: =Parent.Width-40
        Height: =88
        Mode: =TextMode.MultiLine
        Default: =""
        HintText: ="是正内容を入力"

    DueLabel As label:
        X: =20
        Y: =478
        Width: =160
        Height: =30
        Text: ="是正期限"
    DueInput As datepicker:
        X: =20
        Y: =508
        Width: =Parent.Width-40
        Height: =44
        DefaultDate: =Today()+3

    SaveBtn As button:
        X: =20
        Y: =584
        Width: =Parent.Width-40
        Height: =60
        Text: ="登録する"
        Fill: =RGBA(184,24,35,1)
        Color: =RGBA(255,255,255,1)
        Size: =17
        OnSelect: |-
            =If(
                IsBlank(SiteInput.Text) || IsBlank(LocationInput.Text) || IsBlank(IssueInput.Text),
                Notify("工事名・場所・指摘内容を入力してください", NotificationType.Error),
                Collect(colActive,
                    {
                        ID: "N-" & Text(CountRows(colActive)+CountRows(colCompleted)+1,"000"),
                        Site: SiteInput.Text,
                        Location: LocationInput.Text,
                        Trade: TradeInput.Text,
                        Issue: IssueInput.Text,
                        DueDate: DueInput.SelectedDate,
                        Status: "対応中",
                        BeforePhoto: Blank(),
                        AfterPhoto: Blank(),
                        Action: "",
                        CreatedAt: Now(),
                        CompletedAt: Blank()
                    }
                );
                Notify("登録しました", NotificationType.Success);
                Reset(SiteInput); Reset(LocationInput); Reset(TradeInput); Reset(IssueInput); Reset(DueInput);
                Navigate(SizesScreen, ScreenTransition.Fade)
            )
