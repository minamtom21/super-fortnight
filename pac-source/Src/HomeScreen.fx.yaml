HomeScreen As screen:
    Fill: =RGBA(255, 248, 240, 1)
    Height: =Max(App.Height, App.DesignHeight)
    Width: =Max(App.Width, App.DesignWidth)

    HeaderRect As label:
        Height: =72
        Width: =Parent.Width
        X: =0
        Y: =0
        Fill: =RGBA(200, 57, 47, 1)
        Text: =""

    BrandLabel As label:
        Height: =48
        Size: =22
        Text: ="🍕 みなとみらいピッツァ"
        Color: =RGBA(255, 255, 255, 1)
        Width: =Parent.Width - 32
        X: =16
        Y: =12
        ZIndex: =2

    SubHeading As label:
        Height: =28
        Size: =11
        Text: ="読み込み済み: 商品" & CountRows(colProducts) & "件 / サイズ" & CountRows(colSizes) & "種 / クーポン" & CountRows(colCoupons) & "種"
        Color: =RGBA(122, 110, 99, 1)
        Width: =Parent.Width - 32
        X: =16
        Y: =84
        ZIndex: =3

    PromoLabel As label:
        Height: =32
        Size: =13
        FontWeight: =FontWeight.Bold
        Text: ="🌊 みなとみらい21エリア限定デリバリー"
        Color: =RGBA(200, 57, 47, 1)
        Width: =Parent.Width - 32
        X: =16
        Y: =120
        ZIndex: =4

    ProductsHeading As label:
        Height: =28
        Size: =14
        FontWeight: =FontWeight.Bold
        Text: ="メニュー（一部）"
        Width: =Parent.Width - 32
        X: =16
        Y: =164
        ZIndex: =5

    Product1 As label:
        Height: =48
        Size: =13
        Text: =LookUp(colProducts, ProductID = "minato").Emoji & " " & LookUp(colProducts, ProductID = "minato").Name & "  M ¥" & LookUp(colProducts, ProductID = "minato").PriceM
        Width: =Parent.Width - 32
        X: =16
        Y: =200
        ZIndex: =6

    Product2 As label:
        Height: =48
        Size: =13
        Text: =LookUp(colProducts, ProductID = "margherita").Emoji & " " & LookUp(colProducts, ProductID = "margherita").Name & "  M ¥" & LookUp(colProducts, ProductID = "margherita").PriceM
        Width: =Parent.Width - 32
        X: =16
        Y: =252
        ZIndex: =7

    Product3 As label:
        Height: =48
        Size: =13
        Text: =LookUp(colProducts, ProductID = "seafood").Emoji & " " & LookUp(colProducts, ProductID = "seafood").Name & "  M ¥" & LookUp(colProducts, ProductID = "seafood").PriceM
        Width: =Parent.Width - 32
        X: =16
        Y: =304
        ZIndex: =8

    Product4 As label:
        Height: =48
        Size: =13
        Text: =LookUp(colProducts, ProductID = "diavola").Emoji & " " & LookUp(colProducts, ProductID = "diavola").Name & "  M ¥" & LookUp(colProducts, ProductID = "diavola").PriceM
        Width: =Parent.Width - 32
        X: =16
        Y: =356
        ZIndex: =9

    SizeLabel As label:
        Height: =28
        Size: =11
        Text: ="サイズ: " & Concat(colSizes, Label, " / ")
        Width: =Parent.Width - 32
        X: =16
        Y: =412
        Color: =RGBA(122, 110, 99, 1)
        ZIndex: =10

    CrustLabel As label:
        Height: =28
        Size: =11
        Text: ="生地: " & Concat(colCrusts, Name, " / ")
        Width: =Parent.Width - 32
        X: =16
        Y: =444
        Color: =RGBA(122, 110, 99, 1)
        ZIndex: =11

    ToppingLabel As label:
        Height: =44
        Size: =11
        Text: ="トッピング: " & Concat(colToppings, Name, " / ")
        Width: =Parent.Width - 32
        X: =16
        Y: =476
        Color: =RGBA(122, 110, 99, 1)
        ZIndex: =12

    AreaLabel As label:
        Height: =44
        Size: =11
        Text: ="配達エリア: " & Concat(colDeliveryAreas, AreaName, " / ")
        Width: =Parent.Width - 32
        X: =16
        Y: =528
        Color: =RGBA(122, 110, 99, 1)
        ZIndex: =13

    CouponLabel As label:
        Height: =44
        Size: =11
        Text: ="クーポン: " & Concat(colCoupons, Code & " (" & Label & ")", " / ")
        Width: =Parent.Width - 32
        X: =16
        Y: =580
        Color: =RGBA(122, 110, 99, 1)
        ZIndex: =14

    FooterLabel As label:
        Height: =40
        Size: =10
        Text: ="© 2026 みなとみらいピッツァ – Studio で画面を編集してください"
        Width: =Parent.Width - 32
        X: =16
        Y: =640
        Align: =Align.Center
        Color: =RGBA(122, 110, 99, 1)
        ZIndex: =15

    OrderCta As label:
        Height: =56
        Width: =Parent.Width - 32
        X: =16
        Y: =688
        Text: ="🛒 Power Apps Studioでカート/注文画面を実装してください"
        Fill: =RGBA(200, 57, 47, 1)
        Color: =RGBA(255, 255, 255, 1)
        Size: =13
        FontWeight: =FontWeight.Bold
        Align: =Align.Center
        ZIndex: =16
