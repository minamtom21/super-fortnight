HomeScreen As screen:
    Fill: =RGBA(255, 248, 240, 1)
    Height: =Max(App.Height, App.DesignHeight)
    Width: =Max(App.Width, App.DesignWidth)
    OnVisible: =If(IsBlank(varSelectedStore), Navigate(StoreSelectScreen))

    HmHeaderBar As rectangle:
        X: =0
        Y: =0
        Width: =Parent.Width
        Height: =88
        Fill: =RGBA(200, 57, 47, 1)

    HmBrand As label:
        X: =16
        Y: =10
        Width: =Parent.Width - 130
        Height: =32
        Text: ="🍕 みなとみらいピッツァ"
        Color: =RGBA(255, 255, 255, 1)
        Size: =17
        FontWeight: =FontWeight.Bold

    HmStoreLabel As label:
        X: =16
        Y: =44
        Width: =Parent.Width - 130
        Height: =34
        Text: =If(IsBlank(varSelectedStore), "店舗未選択", varSelectedStore.Emoji & " " & varSelectedStore.Name & " からお届け")
        Color: =RGBA(255, 236, 224, 1)
        Size: =12

    HmChangeStoreBtn As button:
        X: =Parent.Width - 112
        Y: =12
        Width: =96
        Height: =32
        Text: ="店舗変更"
        Fill: =RGBA(245, 181, 74, 1)
        Color: =RGBA(43, 33, 24, 1)
        Size: =12
        OnSelect: =Navigate(StoreSelectScreen, ScreenTransition.UnCover)

    HmCartBtn As button:
        X: =Parent.Width - 112
        Y: =48
        Width: =96
        Height: =32
        Text: ="🛒 カート " & Sum(colCart, Quantity)
        Fill: =RGBA(43, 33, 24, 1)
        Color: =RGBA(255, 255, 255, 1)
        Size: =12
        OnSelect: =Navigate(CartScreen, ScreenTransition.Cover)

    HmMenuGallery As gallery.galleryVertical:
        X: =16
        Y: =100
        Width: =Parent.Width - 32
        Height: =Parent.Height - 116
        TemplateSize: =110
        TemplatePadding: =8
        Items: =colProducts

        HmCardBg As rectangle:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth
            Height: =102
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(233, 220, 203, 1)
            BorderThickness: =1

        HmItemEmoji As label:
            X: =12
            Y: =12
            Width: =56
            Height: =56
            Text: =ThisItem.Emoji
            Size: =30
            Align: =Align.Center

        HmItemName As label:
            X: =76
            Y: =12
            Width: =Parent.TemplateWidth - 200
            Height: =26
            Text: =ThisItem.Name
            Size: =14
            FontWeight: =FontWeight.Bold

        HmItemDesc As label:
            X: =76
            Y: =40
            Width: =Parent.TemplateWidth - 200
            Height: =50
            Text: =ThisItem.Description
            Size: =10
            Color: =RGBA(122, 110, 99, 1)

        HmItemPrice As label:
            X: =Parent.TemplateWidth - 120
            Y: =14
            Width: =108
            Height: =26
            Text: =If(ThisItem.Category = "Pizza", "M ¥" & ThisItem.PriceM, "¥" & ThisItem.Price)
            Size: =14
            FontWeight: =FontWeight.Bold
            Color: =RGBA(200, 57, 47, 1)
            Align: =Align.Right

        HmAddBtn As button:
            X: =Parent.TemplateWidth - 120
            Y: =56
            Width: =108
            Height: =36
            Text: ="＋ 追加"
            Fill: =RGBA(200, 57, 47, 1)
            Color: =RGBA(255, 255, 255, 1)
            Size: =13
            OnSelect: |-
                =With(
                    { p: If(ThisItem.Category = "Pizza", ThisItem.PriceM, ThisItem.Price) },
                    If(
                        CountRows(Filter(colCart, ProductID = ThisItem.ProductID)) > 0,
                        UpdateIf(colCart, ProductID = ThisItem.ProductID, { Quantity: Quantity + 1, LineTotal: (Quantity + 1) * UnitPrice }),
                        Collect(colCart, { ProductID: ThisItem.ProductID, Name: ThisItem.Name, Emoji: ThisItem.Emoji, Category: ThisItem.Category, UnitPrice: p, Quantity: 1, LineTotal: p })
                    )
                )
