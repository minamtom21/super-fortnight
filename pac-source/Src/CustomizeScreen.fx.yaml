CustomizeScreen As screen:
    Fill: =RGBA(255, 248, 240, 1)

    HeaderRect As rectangle:
        X: =0
        Y: =0
        Width: =Parent.Width
        Height: =56
        Fill: =RGBA(200, 57, 47, 1)

    BackButton As button:
        X: =8
        Y: =10
        Width: =60
        Height: =36
        Text: ="< 戻る"
        Fill: =RGBA(200, 57, 47, 1)
        Color: =RGBA(255, 255, 255, 1)
        OnSelect: =Navigate(HomeScreen, ScreenTransition.UnCover)

    TitleLabel As label:
        X: =72
        Y: =12
        Width: =Parent.Width - 144
        Height: =32
        Text: =Concatenate(varSelectedProduct.Emoji, " ", varSelectedProduct.Name)
        Color: =RGBA(255, 255, 255, 1)
        Size: =16
        FontWeight: =FontWeight.Bold

    SizeHeading As label:
        X: =16
        Y: =72
        Width: =Parent.Width - 32
        Height: =20
        Text: ="サイズ"
        Size: =11
        FontWeight: =FontWeight.Bold
        Color: =RGBA(122, 110, 99, 1)

    SizeRadio As radio:
        X: =16
        Y: =94
        Width: =Parent.Width - 32
        Height: =48
        Items: =colSizes
        Layout: =Layout.Horizontal
        Default: ="M"
        OnChange: =Set(varSelectedSize, Self.Selected.SizeID)

    CrustHeading As label:
        X: =16
        Y: =152
        Width: =Parent.Width - 32
        Height: =20
        Text: ="生地"
        Size: =11
        FontWeight: =FontWeight.Bold
        Color: =RGBA(122, 110, 99, 1)

    CrustDropdown As dropdown:
        X: =16
        Y: =174
        Width: =Parent.Width - 32
        Height: =40
        Items: =colCrusts
        OnChange: =Set(varSelectedCrustId, Self.Selected.CrustID)

    ToppingsHeading As label:
        X: =16
        Y: =226
        Width: =Parent.Width - 32
        Height: =20
        Text: ="追加トッピング（複数可）"
        Size: =11
        FontWeight: =FontWeight.Bold
        Color: =RGBA(122, 110, 99, 1)

    ToppingsGallery As gallery.galleryVertical:
        X: =16
        Y: =248
        Width: =Parent.Width - 32
        Height: =260
        TemplateSize: =44
        Items: =colToppings

        ToppingCheckbox As checkbox:
            X: =0
            Y: =6
            Width: =Parent.TemplateWidth - 80
            Height: =32
            Text: =ThisItem.Name
            Default: =false
            OnCheck: =Collect(colSelectedToppings, ThisItem)
            OnUncheck: =RemoveIf(colSelectedToppings, ToppingID = ThisItem.ToppingID)

        ToppingPriceLabel As label:
            X: =Parent.TemplateWidth - 80
            Y: =6
            Width: =80
            Height: =32
            Text: =Concatenate("+¥", Text(ThisItem.ExtraPrice, "[$-ja-JP]#,##0"))
            Size: =11
            Align: =Align.Right
            Color: =RGBA(200, 57, 47, 1)

    QtyHeading As label:
        X: =16
        Y: =518
        Width: =Parent.Width - 32
        Height: =20
        Text: ="数量"
        Size: =11
        FontWeight: =FontWeight.Bold
        Color: =RGBA(122, 110, 99, 1)

    QtyMinus As button:
        X: =16
        Y: =540
        Width: =40
        Height: =40
        Text: ="−"
        OnSelect: =Set(varSelectedQty, Max(1, varSelectedQty - 1))

    QtyLabel As label:
        X: =60
        Y: =540
        Width: =60
        Height: =40
        Text: =Text(varSelectedQty)
        Align: =Align.Center
        Size: =16
        FontWeight: =FontWeight.Bold

    QtyPlus As button:
        X: =124
        Y: =540
        Width: =40
        Height: =40
        Text: ="＋"
        OnSelect: =Set(varSelectedQty, Min(10, varSelectedQty + 1))

    UnitPriceLabel As label:
        X: =180
        Y: =540
        Width: =Parent.Width - 196
        Height: =40
        Text: =Concatenate(
            "小計 ¥",
            Text(
                (Switch(
                    varSelectedSize,
                    "S", varSelectedProduct.PriceS,
                    "M", varSelectedProduct.PriceM,
                    "L", varSelectedProduct.PriceL,
                    varSelectedProduct.PriceM
                )
                + LookUp(colCrusts, CrustID = varSelectedCrustId, ExtraPrice)
                + Sum(colSelectedToppings, ExtraPrice))
                * varSelectedQty,
                "[$-ja-JP]#,##0"
            )
        )
        Align: =Align.Right
        FontWeight: =FontWeight.Bold
        Color: =RGBA(200, 57, 47, 1)
        Size: =14

    AddToCartButton As button:
        X: =16
        Y: =Parent.Height - 72
        Width: =Parent.Width - 32
        Height: =56
        Text: ="カートに追加"
        Fill: =RGBA(200, 57, 47, 1)
        Color: =RGBA(255, 255, 255, 1)
        Size: =16
        FontWeight: =FontWeight.Bold
        OnSelect: =With(
            {
                unitPrice:
                    Switch(
                        varSelectedSize,
                        "S", varSelectedProduct.PriceS,
                        "M", varSelectedProduct.PriceM,
                        "L", varSelectedProduct.PriceL,
                        varSelectedProduct.PriceM
                    )
                    + LookUp(colCrusts, CrustID = varSelectedCrustId, ExtraPrice)
                    + Sum(colSelectedToppings, ExtraPrice)
            },
            Collect(
                colCart,
                {
                    ProductID: varSelectedProduct.ProductID,
                    Name: varSelectedProduct.Name,
                    Emoji: varSelectedProduct.Emoji,
                    Category: varSelectedProduct.Category,
                    SizeID: varSelectedSize,
                    CrustID: varSelectedCrustId,
                    UnitPrice: unitPrice,
                    Quantity: varSelectedQty,
                    LineTotal: unitPrice * varSelectedQty
                }
            )
        ) ;; Navigate(HomeScreen, ScreenTransition.UnCover)
