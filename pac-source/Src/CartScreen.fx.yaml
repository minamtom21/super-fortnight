CartScreen As screen:
    Fill: =RGBA(255, 248, 240, 1)

    HeaderRect As rectangle:
        X: =0
        Y: =0
        Width: =Parent.Width
        Height: =56
        Fill: =RGBA(200, 57, 47, 1)

    BackButton As button:
        X: =8
        Y: =10
        Width: =60
        Height: =36
        Text: ="< 戻る"
        Fill: =RGBA(200, 57, 47, 1)
        Color: =RGBA(255, 255, 255, 1)
        OnSelect: =Navigate(HomeScreen, ScreenTransition.UnCover)

    TitleLabel As label:
        X: =72
        Y: =12
        Width: =Parent.Width - 144
        Height: =32
        Text: ="🛒 カート"
        Color: =RGBA(255, 255, 255, 1)
        Size: =16
        FontWeight: =FontWeight.Bold

    EmptyLabel As label:
        X: =16
        Y: =96
        Width: =Parent.Width - 32
        Height: =40
        Text: ="カートに商品はありません"
        Color: =RGBA(122, 110, 99, 1)
        Align: =Align.Center
        Visible: =CountRows(colCart) = 0

    CartGallery As gallery.galleryVertical:
        X: =0
        Y: =72
        Width: =Parent.Width
        Height: =Parent.Height - 320
        TemplateSize: =96
        Items: =colCart
        Visible: =CountRows(colCart) > 0

        RowBg As rectangle:
            X: =12
            Y: =6
            Width: =Parent.TemplateWidth - 24
            Height: =84
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(233, 220, 203, 1)
            BorderThickness: =1

        EmojiLabel As label:
            X: =24
            Y: =16
            Width: =56
            Height: =56
            Text: =ThisItem.Emoji
            Size: =28
            Align: =Align.Center

        NameLabel As label:
            X: =88
            Y: =14
            Width: =Parent.TemplateWidth - 200
            Height: =22
            Text: =ThisItem.Name
            Size: =13
            FontWeight: =FontWeight.Bold

        MetaLabel As label:
            X: =88
            Y: =38
            Width: =Parent.TemplateWidth - 200
            Height: =18
            Text: =If(
                ThisItem.Category = "Pizza",
                Concatenate(
                    LookUp(colSizes, SizeID = ThisItem.SizeID, Label),
                    " / ",
                    LookUp(colCrusts, CrustID = ThisItem.CrustID, Name)
                ),
                ""
            )
            Size: =10
            Color: =RGBA(122, 110, 99, 1)

        QtyMinus As button:
            X: =88
            Y: =60
            Width: =28
            Height: =24
            Text: ="−"
            OnSelect: =If(
                ThisItem.Quantity <= 1,
                Remove(colCart, ThisItem),
                Patch(colCart, ThisItem, { Quantity: ThisItem.Quantity - 1, LineTotal: ThisItem.UnitPrice * (ThisItem.Quantity - 1) })
            )

        QtyLabel As label:
            X: =116
            Y: =60
            Width: =32
            Height: =24
            Text: =Text(ThisItem.Quantity)
            Align: =Align.Center

        QtyPlus As button:
            X: =148
            Y: =60
            Width: =28
            Height: =24
            Text: ="＋"
            OnSelect: =Patch(colCart, ThisItem, { Quantity: Min(20, ThisItem.Quantity + 1), LineTotal: ThisItem.UnitPrice * Min(20, ThisItem.Quantity + 1) })

        RemoveBtn As button:
            X: =180
            Y: =60
            Width: =50
            Height: =24
            Text: ="削除"
            Color: =RGBA(122, 110, 99, 1)
            Fill: =RGBA(0, 0, 0, 0)
            OnSelect: =Remove(colCart, ThisItem)

        LineTotalLabel As label:
            X: =Parent.TemplateWidth - 110
            Y: =34
            Width: =96
            Height: =28
            Text: =Concatenate("¥", Text(ThisItem.LineTotal, "[$-ja-JP]#,##0"))
            Align: =Align.Right
            Color: =RGBA(200, 57, 47, 1)
            FontWeight: =FontWeight.Bold

    CouponInput As text:
        X: =16
        Y: =Parent.Height - 240
        Width: =Parent.Width - 116
        Height: =40
        HintText: ="クーポンコード"
        Default: =""

    CouponApply As button:
        X: =Parent.Width - 96
        Y: =Parent.Height - 240
        Width: =80
        Height: =40
        Text: ="適用"
        OnSelect: =Set(
            varCoupon,
            LookUp(colCoupons, Code = Upper(Trim(CouponInput.Text)))
        ) ;; Set(
            varDiscount,
            With(
                { sub: Sum(colCart, LineTotal) },
                If(
                    IsBlank(varCoupon) Or sub < varCoupon.MinSubtotal,
                    0,
                    If(
                        varCoupon.DiscountType = "Percent",
                        RoundDown(sub * varCoupon.Value / 100, 0),
                        Min(varCoupon.Value, sub)
                    )
                )
            )
        )

    CouponMessage As label:
        X: =16
        Y: =Parent.Height - 192
        Width: =Parent.Width - 32
        Height: =24
        Text: =If(
            IsBlank(varCoupon),
            "",
            If(
                Sum(colCart, LineTotal) < varCoupon.MinSubtotal,
                Concatenate("「", varCoupon.Code, "」は ¥", Text(varCoupon.MinSubtotal, "[$-ja-JP]#,##0"), " 以上から利用可能です。"),
                Concatenate("「", varCoupon.Code, "」適用中：", varCoupon.Label)
            )
        )
        Size: =11
        Color: =RGBA(200, 57, 47, 1)

    SubtotalLabel As label:
        X: =16
        Y: =Parent.Height - 160
        Width: =Parent.Width - 32
        Height: =22
        Text: =Concatenate("小計  ¥", Text(Sum(colCart, LineTotal), "[$-ja-JP]#,##0"))

    DiscountLabel As label:
        X: =16
        Y: =Parent.Height - 136
        Width: =Parent.Width - 32
        Height: =22
        Text: =Concatenate("割引  -¥", Text(varDiscount, "[$-ja-JP]#,##0"))
        Visible: =varDiscount > 0
        Color: =RGBA(200, 57, 47, 1)

    TotalLabel As label:
        X: =16
        Y: =Parent.Height - 110
        Width: =Parent.Width - 32
        Height: =28
        Text: =Concatenate("合計  ¥", Text(Max(0, Sum(colCart, LineTotal) - varDiscount), "[$-ja-JP]#,##0"))
        Size: =16
        FontWeight: =FontWeight.Bold

    CheckoutButton As button:
        X: =16
        Y: =Parent.Height - 72
        Width: =Parent.Width - 32
        Height: =56
        Text: ="注文に進む"
        Fill: =RGBA(200, 57, 47, 1)
        Color: =RGBA(255, 255, 255, 1)
        Size: =16
        FontWeight: =FontWeight.Bold
        DisplayMode: =If(CountRows(colCart) = 0, DisplayMode.Disabled, DisplayMode.Edit)
        OnSelect: =Navigate(CheckoutScreen, ScreenTransition.Cover)
