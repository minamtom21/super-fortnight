StoreSelectScreen As screen:
    Fill: =RGBA(245,247,250,1)
    Height: =Max(App.Height, App.DesignHeight)
    Width: =Max(App.Width, App.DesignWidth)

    Header As label:
        Height: =72
        Width: =Parent.Width
        Fill: =RGBA(184,24,35,1)
        Text: ="NAOSU  是正写真管理"
        Color: =RGBA(255,255,255,1)
        Size: =22
        FontWeight: =FontWeight.Bold
        PaddingLeft: =20

    Summary As label:
        X: =20
        Y: =92
        Width: =Parent.Width-40
        Height: =56
        Text: ="対応中 " & CountRows(colActive) & "件　／　完了保管 " & CountRows(colCompleted) & "件"
        Size: =17
        FontWeight: =FontWeight.Bold
        Color: =RGBA(45,55,65,1)

    BtnNew As button:
        X: =20
        Y: =170
        Width: =Parent.Width-40
        Height: =72
        Text: ="＋ 新しい是正を登録"
        Fill: =RGBA(184,24,35,1)
        Color: =RGBA(255,255,255,1)
        Size: =18
        OnSelect: =Navigate(HomeScreen, ScreenTransition.Fade)

    BtnActive As button:
        X: =20
        Y: =262
        Width: =Parent.Width-40
        Height: =72
        Text: ="対応中を見る（" & CountRows(colActive) & "件）"
        Fill: =RGBA(34,92,145,1)
        Color: =RGBA(255,255,255,1)
        Size: =18
        OnSelect: =Navigate(SizesScreen, ScreenTransition.Fade)

    BtnCompleted As button:
        X: =20
        Y: =354
        Width: =Parent.Width-40
        Height: =72
        Text: ="完了保管庫を見る（" & CountRows(colCompleted) & "件）"
        Fill: =RGBA(75,82,90,1)
        Color: =RGBA(255,255,255,1)
        Size: =18
        OnSelect: =Navigate(DeliveryScreen, ScreenTransition.Fade)

    Note As label:
        X: =20
        Y: =460
        Width: =Parent.Width-40
        Height: =130
        Text: ="この版は単体動作確認用です。登録データはアプリ実行中のコレクションに保存されます。運用時はSharePointリストと写真ライブラリへ接続してください。"
        Size: =13
        Color: =RGBA(90,98,106,1)
