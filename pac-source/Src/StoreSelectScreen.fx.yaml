StoreSelectScreen As screen:
    Fill: =RGBA(255, 248, 240, 1)
    Height: =Max(App.Height, App.DesignHeight)
    Width: =Max(App.Width, App.DesignWidth)

    StHeader As label:
        Height: =72
        Width: =Parent.Width
        X: =0
        Y: =0
        Fill: =RGBA(200, 57, 47, 1)
        Text: ="🏪 店舗を選んでください"
        Color: =RGBA(255, 255, 255, 1)
        Size: =18
        FontWeight: =FontWeight.Bold
        Align: =Align.Center

    StIntro As label:
        Height: =48
        Width: =Parent.Width - 32
        X: =16
        Y: =84
        Text: ="ご注文先の店舗を1つお選びください。Power Apps Studio で各カードに『OnSelect』を設定し、Set(varSelectedStore, ThisItem); Navigate(HomeScreen) で連携してください。"
        Size: =11
        Color: =RGBA(122, 110, 99, 1)

    StStoresHeading As label:
        Height: =28
        Width: =Parent.Width - 32
        X: =16
        Y: =144
        Text: ="読み込み済み店舗: " & CountRows(colStores) & "件"
        Size: =14
        FontWeight: =FontWeight.Bold

    StStore1 As label:
        Height: =64
        Width: =Parent.Width - 32
        X: =16
        Y: =184
        Text: =Index(colStores, 1).Emoji & " " & Index(colStores, 1).Name & Char(10) & Index(colStores, 1).Address & "  ☎ " & Index(colStores, 1).Phone & "  ⏰ " & Index(colStores, 1).OpenHours
        Size: =11

