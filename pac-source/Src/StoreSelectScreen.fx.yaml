StoreSelectScreen As screen:
    Fill: =RGBA(255, 248, 240, 1)
    Height: =Max(App.Height, App.DesignHeight)
    Width: =Max(App.Width, App.DesignWidth)

    StHeaderBar As rectangle:
        X: =0
        Y: =0
        Width: =Parent.Width
        Height: =72
        Fill: =RGBA(200, 57, 47, 1)

    StHeaderText As label:
        X: =16
        Y: =16
        Width: =Parent.Width - 32
        Height: =40
        Text: ="🏪 店舗を選んでください"
        Color: =RGBA(255, 255, 255, 1)
        Size: =20
        FontWeight: =FontWeight.Bold

    StIntro As label:
        X: =16
        Y: =84
        Width: =Parent.Width - 32
        Height: =32
        Text: ="ご注文先の店舗をタップしてお選びください（全" & CountRows(colStores) & "店舗）"
        Size: =12
        Color: =RGBA(122, 110, 99, 1)

    StStoreGallery As gallery.galleryVertical:
        X: =16
        Y: =124
        Width: =Parent.Width - 32
        Height: =Parent.Height - 140
        TemplateSize: =148
        TemplatePadding: =8
        Items: =colStores

        StRowBg As rectangle:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth
            Height: =140
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(233, 220, 203, 1)
            BorderThickness: =1

        StRowEmoji As label:
            X: =12
            Y: =12
            Width: =56
            Height: =56
            Text: =ThisItem.Emoji
            Size: =30
            Align: =Align.Center

        StRowName As label:
            X: =76
            Y: =12
            Width: =Parent.TemplateWidth - 90
            Height: =30
            Text: =ThisItem.Name
            Size: =16
            FontWeight: =FontWeight.Bold

        StRowAddr As label:
            X: =76
            Y: =44
            Width: =Parent.TemplateWidth - 90
            Height: =36
            Text: =ThisItem.Address
            Size: =11
            Color: =RGBA(122, 110, 99, 1)

        StRowHours As label:
            X: =76
            Y: =80
            Width: =Parent.TemplateWidth - 90
            Height: =24
            Text: ="⏰ " & ThisItem.OpenHours & "   ☎ " & ThisItem.Phone
            Size: =11
            Color: =RGBA(122, 110, 99, 1)

        StRowSelect As button:
            X: =16
            Y: =104
            Width: =Parent.TemplateWidth - 32
            Height: =32
            Text: ="この店舗で注文する →"
            Fill: =RGBA(200, 57, 47, 1)
            Color: =RGBA(255, 255, 255, 1)
            Size: =13
            FontWeight: =FontWeight.Semibold
            OnSelect: =Set(varSelectedStore, ThisItem); Navigate(HomeScreen, ScreenTransition.Cover)
