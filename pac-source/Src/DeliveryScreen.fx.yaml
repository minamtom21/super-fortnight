DeliveryScreen As screen:
    Fill: =RGBA(245,247,250,1)
    Height: =Max(App.Height, App.DesignHeight)
    Width: =Max(App.Width, App.DesignWidth)

    Header As label:
        Height: =64
        Width: =Parent.Width
        Fill: =RGBA(75,82,90,1)
        Text: ="完了保管庫  " & CountRows(colCompleted) & "件"
        Color: =RGBA(255,255,255,1)
        Size: =20
        FontWeight: =FontWeight.Bold
        PaddingLeft: =20

    HomeBtn As button:
        X: =Parent.Width-100
        Y: =12
        Width: =80
        Height: =40
        Text: ="ホーム"
        Fill: =RGBA(120,125,130,1)
        OnSelect: =Navigate(StoreSelectScreen, ScreenTransition.Fade)

    SearchInput As text:
        X: =20
        Y: =82
        Width: =Parent.Width-40
        Height: =44
        Default: =""
        HintText: ="完了データを検索"

    CompletedGallery As gallery.vertical:
        X: =20
        Y: =142
        Width: =Parent.Width-40
        Height: =Parent.Height-162
        TemplateSize: =180
        Items: =Filter(colCompleted, IsBlank(SearchInput.Text) || SearchInput.Text in Site || SearchInput.Text in Location || SearchInput.Text in Trade || SearchInput.Text in Issue)

        Card As label:
            X: =0
            Y: =4
            Width: =Parent.TemplateWidth
            Height: =166
            Fill: =RGBA(255,255,255,1)
            Text: =""
            BorderColor: =RGBA(215,220,225,1)
            BorderThickness: =1

        Title As label:
            X: =12
            Y: =12
            Width: =Parent.TemplateWidth-24
            Height: =30
            Text: =ThisItem.ID & "  " & ThisItem.Site
            FontWeight: =FontWeight.Bold
            Size: =14

        Detail As label:
            X: =12
            Y: =44
            Width: =Parent.TemplateWidth-24
            Height: =62
            Text: =ThisItem.Location & "／" & ThisItem.Trade & Char(10) & ThisItem.Issue
            Size: =12

        CompletedDate As label:
            X: =12
            Y: =108
            Width: =220
            Height: =34
            Text: ="完了：" & Text(ThisItem.CompletedAt,"yyyy/mm/dd hh:mm")
            Color: =RGBA(70,78,86,1)

        RestoreBtn As button:
            X: =Parent.TemplateWidth-132
            Y: =108
            Width: =120
            Height: =40
            Text: ="対応中へ戻す"
            Fill: =RGBA(34,92,145,1)
            OnSelect: |-
                =Collect(colActive,
                    Patch(ThisItem,
                        {
                            Status: "対応中",
                            CompletedAt: Blank()
                        }
                    )
                );
                Remove(colCompleted, ThisItem);
                Notify("対応中へ戻しました", NotificationType.Success)
