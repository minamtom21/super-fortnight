DeliveryScreen As screen:
    Fill: =RGBA(245,247,250,1)
    Height: =Max(App.Height, App.DesignHeight)
    Width: =Max(App.Width, App.DesignWidth)

    CompletedHeader As label:
        Height: =64
        Width: =Parent.Width
        Fill: =RGBA(75,82,90,1)
        Text: ="完了保管庫  " & CountRows(colCompleted) & "件"
        Color: =RGBA(255,255,255,1)
        Size: =20
        FontWeight: =FontWeight.Bold
        PaddingLeft: =20

    CompletedHomeBtn As button:
        X: =Parent.Width-100
        Y: =12
        Width: =80
        Height: =40
        Text: ="ホーム"
        Fill: =RGBA(120,125,130,1)
        OnSelect: =Navigate(StoreSelectScreen, ScreenTransition.Fade)

    CompletedInfo As label:
        X: =20
        Y: =100
        Width: =Parent.Width-40
        Height: =220
        Fill: =RGBA(255,255,255,1)
        BorderColor: =RGBA(215,220,225,1)
        BorderThickness: =1
        PaddingLeft: =16
        PaddingTop: =16
        Size: =14
        Text: =If(IsEmpty(colCompleted),"完了データはありません。",First(colCompleted).ID & "  " & First(colCompleted).Site & Char(10) & First(colCompleted).Location & "／" & First(colCompleted).Trade & Char(10) & First(colCompleted).Issue & Char(10) & "完了：" & Text(First(colCompleted).CompletedAt,"yyyy/mm/dd hh:mm"))

    CompletedRestoreBtn As button:
        X: =20
        Y: =350
        Width: =Parent.Width-40
        Height: =60
        Text: ="先頭データを対応中へ戻す"
        Fill: =RGBA(34,92,145,1)
        Color: =RGBA(255,255,255,1)
        DisplayMode: =If(IsEmpty(colCompleted),DisplayMode.Disabled,DisplayMode.Edit)
        OnSelect: |-
            =Collect(colActive,
                Patch(First(colCompleted),
                    {
                        Status: "対応中",
                        CompletedAt: Blank()
                    }
                )
            );
            Remove(colCompleted, First(colCompleted));
            Notify("対応中へ戻しました", NotificationType.Success)

    CompletedHint As label:
        X: =20
        Y: =430
        Width: =Parent.Width-40
        Height: =100
        Text: ="完了データは登録順に確認できます。運用版ではSharePointの完了保管リストへ保存します。"
        Size: =13
        Color: =RGBA(90,98,106,1)
