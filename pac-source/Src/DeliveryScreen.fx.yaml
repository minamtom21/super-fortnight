DeliveryScreen As screen:
    Fill: =RGBA(255, 248, 240, 1)
    Height: =Max(App.Height, App.DesignHeight)
    Width: =Max(App.Width, App.DesignWidth)

    DvHeader As label:
        Height: =56
        Width: =Parent.Width
        X: =0
        Y: =0
        Fill: =RGBA(200, 57, 47, 1)
        Text: ="🚚 配達エリア & 支払い方法"
        Color: =RGBA(255, 255, 255, 1)
        Size: =16
        FontWeight: =FontWeight.Bold

    DvAreasH As label:
        Height: =28
        Width: =Parent.Width - 32
        X: =16
        Y: =72
        Text: ="配達エリア（みなとみらい21地区限定）"
        Size: =14
        FontWeight: =FontWeight.Bold

    DvAreas As label:
        Height: =180
        Width: =Parent.Width - 32
        X: =16
        Y: =104
        Text: =Concat(colDeliveryAreas, "・" & AreaName, Char(10))
        Size: =12

    DvTimesH As label:
        Height: =28
        Width: =Parent.Width - 32
        X: =16
        Y: =300
        Text: ="お届け時間"
        Size: =14
        FontWeight: =FontWeight.Bold

    DvTimes As label:
        Height: =120
        Width: =Parent.Width - 32
        X: =16
        Y: =332
        Text: =Concat(colDeliveryTimes, "・" & Label, Char(10))
        Size: =12

    DvPayH As label:
        Height: =28
        Width: =Parent.Width - 32
        X: =16
        Y: =460
        Text: ="お支払い方法"
        Size: =14
        FontWeight: =FontWeight.Bold

    DvPay As label:
        Height: =100
        Width: =Parent.Width - 32
        X: =16
        Y: =492
        Text: =Concat(colPaymentMethods, "・" & Label, Char(10))
        Size: =12

    DvCouponsH As label:
        Height: =28
        Width: =Parent.Width - 32
        X: =16
        Y: =600
        Text: ="🎟 クーポン"
        Size: =14
        FontWeight: =FontWeight.Bold

    DvCoupons As label:
        Height: =140
        Width: =Parent.Width - 32
        X: =16
        Y: =632
        Text: =Concat(colCoupons, "[" & Code & "] " & Label, Char(10))
        Size: =11
